name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
        exclude:      # GitHub's current Ubuntu image has no Python 3.9; 3.9 runs on macOS and Windows
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; fi
      - run: pip install pillow tzdata
      - name: No local paths in the skill
        run: "! grep -rnE '/Users/|/home/[a-z]|[A-Za-z]:[\\\\/]Users' skills/ README.md --include='*.md' --include='*.py' --include='*.json' --include='*.html' --include='*.txt'"
      - name: No em or en dashes
        run: "! grep -rnP '\\x{2014}|\\x{2013}' skills/ README.md tests/ --include='*.md' --include='*.py' --include='*.json' --include='*.html' --include='*.txt'"
        if: runner.os == 'Linux'
      - name: Only documented media (no personal files)
        run: python tests/check_media.py
      - name: Full pipeline (campaign, transcript, cut, checks, plan, requests, posted, status, ledger, proof, earnings, bad input)
        run: python tests/run_pipeline.py
  whisper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; fi
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; fi
      - run: pip install faster-whisper
      - name: Real transcription of an example NASA clip (faster-whisper, tiny model, ffmpeg-decoded samples)
        run: python tests/whisper_check.py
  no-pillow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Everything except cutting works without Pillow
        run: python tests/run_pipeline.py --no-cut
